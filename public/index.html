<!DOCTYPE html>
<html lang="cs" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ranger stopky</title>
<style>
	:root{--bg:#f3f1e8;--fg:#1a2a1f;--card:#fff;--ac:#1f5a34;--gold:#d9a420;--bd:#cfc9b3;--run:#ffd24a;--runfg:#2a2000;--ice:#d4ecff;--icefg:#0b3b66;--warn:#b3302a}
	[data-theme=dark]{--bg:#111713;--fg:#e8efe6;--card:#1b241e;--ac:#44a86e;--bd:#33423a;--run:#d9a900;--ice:#17314a;--icefg:#bfe3ff;--warn:#ff8a80}
	*{box-sizing:border-box}
	body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
	header{background:var(--ac);color:#fff;border-bottom:4px solid var(--gold);position:sticky;top:0;z-index:5;padding:8px 10px}
	header h1{font-size:1rem;margin:0 0 6px}
	nav{display:flex;gap:6px;overflow-x:auto;align-items:center}
	nav a,nav button{color:#fff;text-decoration:none;border:1px solid #ffffff66;border-radius:8px;padding:6px 10px;white-space:nowrap;background:transparent;font:inherit}
	nav a.on{background:#ffffff33}#st{margin-left:auto;font-size:.8rem;white-space:nowrap}
	main{max-width:640px;margin:0 auto;padding:12px}
	button,input,textarea,select{font:inherit;color:inherit}
	button{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;touch-action:manipulation}
	button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5}
	button.armed{background:var(--warn);color:#fff;border-color:var(--warn)}
	input,textarea,select{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px;margin-top:4px}
	label{display:block;margin:12px 0;font-weight:600}label small{display:block;font-weight:400;opacity:.75}
	.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>*{flex:1}
	h2{font-size:1.1rem;margin:16px 0 6px}
	.list a{display:block;padding:16px;margin:8px 0;background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--gold);border-radius:10px;color:inherit;text-decoration:none;font-weight:600}
	.tabs{display:flex;gap:6px;overflow-x:auto}.tabs button{flex:none}.tabs .on{background:var(--fg);color:var(--bg)}
	.clk{font-size:2.8rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}.clk.paused{opacity:.55}
	.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
	.team{min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;overflow:hidden}
	.team b{font-size:1.5rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
	.team .t{font-size:.85rem;font-variant-numeric:tabular-nums}
	.team.off{opacity:.45}.team.run{background:var(--run);color:var(--runfg);border-color:var(--run)}
	.team.stop{background:var(--ac);color:#fff;border-color:var(--ac)}
	.ice{background:var(--ice);color:var(--icefg);padding:10px;border-radius:10px;font-weight:600;margin:8px 0;text-align:center}
	.frozen .g{filter:saturate(.4)}
	.ev{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);font-size:.85rem}.ev span{flex:1}.ev button{padding:4px 8px}
	.gone{opacity:.4;text-decoration:line-through}.msg{color:var(--warn)}
</style></head><body>
	<header><h1 id="ttl">Ranger stopky</h1><nav id="nav"></nav></header>
	<main id="app"></main>
	<script src="app.js"></script>
</body></html>
